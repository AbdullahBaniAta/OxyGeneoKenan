<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">رسم توضيحي لأسطوانات غاز صناعية وطبية</title>
  <defs>
    <linearGradient id="cylBodyA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e7ecef"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d3da"/>
    </linearGradient>
    <linearGradient id="cylBodyB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#274158"/>
      <stop offset="0.5" stop-color="#16324a"/>
      <stop offset="1" stop-color="#0a1628"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="280" cy="280" r="250" fill="url(#glow)"/>

  <!-- ground shadow -->
  <ellipse cx="285" cy="500" rx="190" ry="18" fill="#000000" opacity="0.18"/>

  <!-- back cylinder (navy, industrial) -->
  <g>
    <rect x="330" y="150" width="110" height="330" rx="26" fill="url(#cylBodyB)" stroke="#0a1628" stroke-width="2"/>
    <rect x="330" y="150" width="110" height="330" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    <rect x="352" y="108" width="66" height="46" rx="10" fill="#4a5b6b"/>
    <rect x="366" y="86" width="38" height="26" rx="8" fill="#8ea0af"/>
    <circle cx="385" cy="86" r="12" fill="#8ea0af"/>
    <rect x="330" y="230" width="110" height="14" fill="#e0632c"/>
    <rect x="330" y="420" width="110" height="10" fill="#64798c" opacity="0.6"/>
    <text x="385" y="330" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#eef2f5" text-anchor="middle" transform="rotate(90 385 330)" opacity="0.55">N2</text>
  </g>

  <!-- front cylinder (white/steel, medical oxygen) -->
  <g>
    <rect x="150" y="110" width="130" height="380" rx="30" fill="url(#cylBodyA)" stroke="#c9d3da" stroke-width="2"/>
    <rect x="176" y="60" width="78" height="54" rx="12" fill="#8ea0af"/>
    <rect x="193" y="34" width="44" height="30" rx="9" fill="#4a5b6b"/>
    <circle cx="215" cy="34" r="14" fill="#4a5b6b"/>
    <!-- valve wheel -->
    <circle cx="215" cy="20" r="10" fill="none" stroke="#16324a" stroke-width="4"/>
    <!-- accent label band -->
    <rect x="150" y="210" width="130" height="20" fill="#c81e2c"/>
    <rect x="150" y="238" width="130" height="6" fill="#e0632c"/>
    <!-- oxygen cross -->
    <g transform="translate(215 350)">
      <rect x="-30" y="-30" width="60" height="60" rx="14" fill="#0f2138" opacity="0.06"/>
      <rect x="-24" y="-6" width="48" height="12" rx="4" fill="#c81e2c"/>
      <rect x="-6" y="-24" width="12" height="48" rx="4" fill="#c81e2c"/>
    </g>
    <text x="215" y="460" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#16324a" text-anchor="middle" opacity="0.65">O2 MEDICAL</text>
  </g>

  <!-- small orange cylinder accent -->
  <g>
    <rect x="60" y="330" width="70" height="170" rx="20" fill="#e0632c"/>
    <rect x="76" y="300" width="38" height="30" rx="8" fill="#c9601f"/>
    <circle cx="95" cy="298" r="10" fill="#a3491a"/>
    <rect x="60" y="380" width="70" height="10" fill="#0a1628" opacity="0.25"/>
  </g>
</svg>
