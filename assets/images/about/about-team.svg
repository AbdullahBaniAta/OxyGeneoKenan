<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" role="img" aria-labelledby="aboutTitle">
  <title id="aboutTitle">فريق العمل في منشأة توريد أسطوانات الغاز</title>
  <rect width="500" height="400" fill="#eef1f4"/>
  <rect x="0" y="300" width="500" height="100" fill="#dde3e8"/>

  <!-- warehouse racking -->
  <rect x="30" y="90" width="140" height="210" fill="#c9d3da"/>
  <rect x="30" y="90" width="140" height="8" fill="#8ea0af"/>
  <rect x="30" y="160" width="140" height="8" fill="#8ea0af"/>
  <rect x="30" y="230" width="140" height="8" fill="#8ea0af"/>

  <!-- cylinders stored on rack -->
  <g>
    <rect x="45" y="105" width="20" height="50" rx="6" fill="#16324a"/>
    <rect x="70" y="105" width="20" height="50" rx="6" fill="#8ea0af"/>
    <rect x="95" y="105" width="20" height="50" rx="6" fill="#c81e2c"/>
    <rect x="120" y="105" width="20" height="50" rx="6" fill="#16324a"/>
    <rect x="45" y="175" width="20" height="50" rx="6" fill="#8ea0af"/>
    <rect x="70" y="175" width="20" height="50" rx="6" fill="#16324a"/>
    <rect x="95" y="175" width="20" height="50" rx="6" fill="#e0632c"/>
    <rect x="120" y="175" width="20" height="50" rx="6" fill="#c9d3da"/>
  </g>

  <!-- two people (simplified geometric) -->
  <g>
    <circle cx="260" cy="180" r="26" fill="#4a5b6b"/>
    <path d="M215 300 C215 245 230 220 260 220 C290 220 305 245 305 300 Z" fill="#16324a"/>
    <rect x="240" y="255" width="40" height="14" fill="#e0632c"/>
  </g>
  <g>
    <circle cx="360" cy="190" r="24" fill="#8ea0af"/>
    <path d="M320 300 C320 250 335 228 360 228 C385 228 400 250 400 300 Z" fill="#64798c"/>
    <rect x="342" y="258" width="36" height="12" fill="#c81e2c"/>
  </g>

  <!-- clipboard -->
  <rect x="290" y="255" width="22" height="30" rx="3" fill="#ffffff" stroke="#8ea0af" stroke-width="2"/>
  <line x1="295" y1="263" x2="307" y2="263" stroke="#4a5b6b" stroke-width="2"/>
  <line x1="295" y1="270" x2="307" y2="270" stroke="#4a5b6b" stroke-width="2"/>

  <!-- delivery truck silhouette -->
  <g transform="translate(400 250)">
    <rect x="0" y="0" width="70" height="34" rx="4" fill="#16324a"/>
    <rect x="70" y="10" width="26" height="24" rx="3" fill="#4a5b6b"/>
    <circle cx="18" cy="38" r="9" fill="#0a1628"/>
    <circle cx="82" cy="38" r="9" fill="#0a1628"/>
    <rect x="6" y="8" width="50" height="14" fill="#e0632c"/>
  </g>
</svg>
